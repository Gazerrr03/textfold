<!doctype html>
<meta charset="utf-8">
<title>TextFold</title>
<style>
  /* while the server starts: the mark folding and unfolding, as it does while a page is saved (reader.css .sv-busy) */
  :root { color-scheme: light dark; --bg: #FAF9F7; --ink: #1A1A1A; --accent: #6B5CE7; --warm: #E08A3C; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1B1915; --ink: #EDE9E3; --accent: #A79FF4; --warm: #E8A35E; } }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 650 26px/1.2 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: -.01em; }
  .box { display: grid; justify-items: center; gap: 14px; }
  .note { margin: 0; max-width: 28em; text-align: center; font: 400 14px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; opacity: .7; }
  .note:empty { display: none; }
  svg { width: 96px; height: 96px; }
  rect { transform-box: fill-box; transform-origin: left center; animation: fold 1.5s cubic-bezier(.2, .8, .2, 1) infinite; }
  .b1 { fill: var(--accent); }
  .b2 { fill: var(--accent); fill-opacity: .4; animation-delay: .18s; }
  .b3 { fill: var(--warm); animation-delay: .36s; }
  @keyframes fold { 0%, 100% { transform: scaleX(1); } 45% { transform: scaleX(.28); } }
  @media (prefers-reduced-motion: reduce) { rect { animation: none; } }
</style>
<div class="box" role="status">
  <svg viewBox="0 0 20 20" aria-hidden="true"><rect class="b1" x="2" y="3" width="16" height="2.4" rx="1.2"/><rect class="b2" x="2" y="8.8" width="11" height="2.4" rx="1.2"/><rect class="b3" x="2" y="14.6" width="5" height="2.4" rx="1.2"/></svg>
  <div>TextFold</div>
  <p class="note"></p>
</div>
